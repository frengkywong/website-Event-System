<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - EventHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
<main>
<section class="section narrow">
  <h1>Contact us</h1>
  <p class="muted">Questions or feedback? Send us a message.</p>
  <form id="contactForm" class="form card-box" novalidate>
    <label>Message
      <textarea id="cMsg" rows="5" placeholder="How can we help?"></textarea>
      <small class="error" id="cErr"></small>
    </label>
    <button class="btn" type="submit">Send message</button>
  </form>
</section>
</main>
<script src="script.js"></script>
</body>
</html>
